name: CRYPTIC Atlas CCA verification
on:
  push:
    paths:
      - "cloudflare/cryptic-atlas/**"
      - "manifests/cryptic-atlas-search-manifest.json"
      - "src/cryptic/**"
      - "tests/cryptic-atlas.test.mjs"
      - "tests/adam-repo-audit.test.mjs"
      - "tests/dualtrace.test.mjs"
      - "tools/adam/**"
      - "docs/CRYPTIC_ATLAS_CCA.md"
      - "docs/ADAM_REPOSITORY_GOVERNANCE.md"
      - "docs/AE_SL6_DUALTRACE_4P.md"
      - "docs/QUANTUM_UNCLONEABILITY_RESEARCH.md"
      - "docs/AE_SOVEREIGN_OS_PHASE2_BOUNDARY.md"
      - ".github/workflows/cryptic-atlas.yml"
  pull_request:
    paths:
      - "cloudflare/cryptic-atlas/**"
      - "manifests/cryptic-atlas-search-manifest.json"
      - "src/cryptic/**"
      - "tests/cryptic-atlas.test.mjs"
      - "tests/adam-repo-audit.test.mjs"
      - "tests/dualtrace.test.mjs"
      - "tools/adam/**"
      - "docs/CRYPTIC_ATLAS_CCA.md"
      - "docs/ADAM_REPOSITORY_GOVERNANCE.md"
      - "docs/AE_SL6_DUALTRACE_4P.md"
      - "docs/QUANTUM_UNCLONEABILITY_RESEARCH.md"
      - "docs/AE_SOVEREIGN_OS_PHASE2_BOUNDARY.md"
      - ".github/workflows/cryptic-atlas.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: JavaScript syntax
        run: |
          node --check cloudflare/cryptic-atlas/worker.mjs
          node --check tools/adam/repo-audit.mjs
          node --check src/cryptic/unbound-inverse.mjs
          node --check src/cryptic/dualtrace.mjs
      - name: Atlas policy and HCCGN tests
        run: node --test tests/cryptic-atlas.test.mjs
      - name: ADAM Gate 0 repository audit tests
        run: node --test tests/adam-repo-audit.test.mjs
      - name: DUALTRACE and unbound inverse tests
        run: node --test tests/dualtrace.test.mjs
      - name: D1 migration schema
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(":memory:")
          db.executescript(pathlib.Path("cloudflare/cryptic-atlas/migrations/0001_init.sql").read_text())
          names = {r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {"atlas_ledger_head","atlas_run_lock","atlas_manifests","atlas_runs","atlas_sources","atlas_events","atlas_skips","atlas_blocks"}
          assert required <= names, required - names
          print("D1 migration schema OK:", len(required), "tables")
          PY
      - name: Search manifest validation
        run: python3 -m json.tool manifests/cryptic-atlas-search-manifest.json > /dev/null
