name: UNIOMNI public knowledge browser
on:
  push:
    paths:
      - "cloudflare/knowledge-search/**"
      - "tests/public-knowledge-search.test.mjs"
      - ".github/workflows/public-knowledge-search.yml"
  pull_request:
    paths:
      - "cloudflare/knowledge-search/**"
      - "tests/public-knowledge-search.test.mjs"
      - ".github/workflows/public-knowledge-search.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check cloudflare/knowledge-search/worker.mjs
      - run: node --test tests/public-knowledge-search.test.mjs
