name: UNIOMNI evidence gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/verify.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --check runtime/app.js && node --check cloudflare/worker.mjs
      - run: bash -n UNIOMNI_STAGE0.sh
      - name: Isolated installer smoke test
        run: AE="$RUNNER_TEMP/uniomni-ae" HOME="$RUNNER_TEMP/uniomni-home" bash UNIOMNI_STAGE0.sh
      - name: Reproducible packaging
        run: python3 tools/package.py && git diff --exit-code -- release.json UNIOMNI_STAGE0.sh
